spring:
  application:
    name: finpulse

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finpulse}
    username: ${DB_USER:finpulse}
    password: ${DB_PASSWORD:finpulse_secret}
    pool:
      initial-size: 5
      max-size: 20

  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finpulse}
    user: ${DB_USER:finpulse}
    password: ${DB_PASSWORD:finpulse_secret}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  threads:
    virtual:
      enabled: true

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:}
      model-name: gpt-4o-mini
      temperature: 0.3
      max-tokens: 300

finpulse:
  alpha-vantage:
    api-key: ${ALPHA_VANTAGE_API_KEY:demo}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.finpulse: INFO
    org.springframework.security: WARN
