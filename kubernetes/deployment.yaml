apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpulse-backend
  labels: { app: finpulse, component: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: finpulse, component: backend }
  template:
    metadata:
      labels: { app: finpulse, component: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/saiale/finpulse/backend:IMAGE_TAG
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_HOST,                valueFrom: { secretKeyRef: { name: finpulse-secrets, key: db-host } } }
            - { name: DB_PASSWORD,            valueFrom: { secretKeyRef: { name: finpulse-secrets, key: db-password } } }
            - { name: OPENAI_API_KEY,         valueFrom: { secretKeyRef: { name: finpulse-secrets, key: openai-api-key } } }
            - { name: ALPHA_VANTAGE_API_KEY,  valueFrom: { secretKeyRef: { name: finpulse-secrets, key: alpha-vantage-key } } }
            - { name: REDIS_HOST, value: redis }
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits:   { memory: 1Gi,   cpu: 1000m }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: finpulse-backend
spec:
  selector: { app: finpulse, component: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finpulse-frontend
  labels: { app: finpulse, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: finpulse, component: frontend }
  template:
    metadata:
      labels: { app: finpulse, component: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/saiale/finpulse/frontend:IMAGE_TAG
          ports: [{ containerPort: 80 }]
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 128Mi, cpu: 200m }
---
apiVersion: v1
kind: Service
metadata:
  name: finpulse-frontend
spec:
  selector: { app: finpulse, component: frontend }
  ports: [{ port: 80, targetPort: 80 }]
  type: LoadBalancer
